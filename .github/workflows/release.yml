# GrokCLI release: build the Windows NSIS installer on tag v* and attach it
# to the GitHub release. Unsigned (no code-signing secrets required).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
        env:
          VITE_GROK_RELEASES_URL: https://github.com/ayzekhdawy/grokcli/releases/latest
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: GrokCLI-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

<!DOCTYPE html><html data-theme="dark"><head><meta charset="UTF-8"/><style>
/* Design tokens from docs/design-tokens.md — single source for CSS.
   Mount via data-theme="dark|light" on documentElement. */

:root,
[data-theme="dark"] {
  color-scheme: dark;

  --radius-window: 12px;
  --radius-lg: 10px;
  --radius-md: 8px;
  --radius-sm: 6px;
  --radius-full: 9999px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 32px;
  --space-8: 48px;

  --sidebar-width: 260px;
  --aside-width: 300px;
  --titlebar-height: 40px;
  --input-min-height: 52px;
  --control-height: 32px;

  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;

  --text-xs: 12px;
  --text-sm: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --leading-tight: 1.35;
  --leading-normal: 1.55;

  --motion-fast: 120ms;
  --motion-normal: 200ms;

  --bg-app: #0d0d0d;
  --bg-sidebar: #101010;
  --bg-main: #151515;
  --bg-aside: #101010;
  --bg-elevated: #1a1a1a;
  --bg-overlay: rgba(0, 0, 0, 0.55);
  --bg-hover: rgba(255, 255, 255, 0.05);
  --bg-active: rgba(255, 255, 255, 0.08);
  --bg-input: #121212;
  --bg-code: #0a0a0a;

  --border-subtle: rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.12);
  --border-focus: rgba(140, 170, 255, 0.55);

  --text-primary: rgba(255, 255, 255, 0.92);
  --text-secondary: rgba(255, 255, 255, 0.58);
  --text-tertiary: rgba(255, 255, 255, 0.38);
  --text-inverse: #0d0d0d;

  --accent: #8aa4ff;
  --accent-muted: rgba(138, 164, 255, 0.14);
  --accent-hover: #a0b6ff;

  --success: #3ecf8e;
  --success-muted: rgba(62, 207, 142, 0.14);
  --warning: #e6b84d;
  --warning-muted: rgba(230, 184, 77, 0.14);
  --danger: #f07178;
  --danger-muted: rgba(240, 113, 120, 0.14);
  --info: #6cb6ff;
  --info-muted: rgba(108, 182, 255, 0.14);

  --scrollbar-thumb: rgba(255, 255, 255, 0.14);
  --scrollbar-track: transparent;
  --shadow-window: 0 16px 48px rgba(0, 0, 0, 0.55);
  --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.45);

  /* mac traffic-light safe inset */
  --titlebar-safe-left: 78px;
}

[data-theme="light"] {
  color-scheme: light;

  --bg-app: #e8e8ea;
  --bg-sidebar: #f3f3f5;
  --bg-main: #fafafa;
  --bg-aside: #f3f3f5;
  --bg-elevated: #ffffff;
  --bg-overlay: rgba(20, 20, 24, 0.4);
  --bg-hover: rgba(0, 0, 0, 0.04);
  --bg-active: rgba(0, 0, 0, 0.07);
  --bg-input: #ffffff;
  --bg-code: #f0f0f2;

  --border-subtle: rgba(0, 0, 0, 0.07);
  --border-strong: rgba(0, 0, 0, 0.12);
  --border-focus: rgba(70, 100, 220, 0.55);

  --text-primary: rgba(0, 0, 0, 0.88);
  --text-secondary: rgba(0, 0, 0, 0.55);
  --text-tertiary: rgba(0, 0, 0, 0.36);
  --text-inverse: #ffffff;

  --accent: #3d5fd9;
  --accent-muted: rgba(61, 95, 217, 0.1);
  --accent-hover: #2f4fc4;

  --success: #1a9f63;
  --success-muted: rgba(26, 159, 99, 0.12);
  --warning: #b58100;
  --warning-muted: rgba(181, 129, 0, 0.12);
  --danger: #d13b45;
  --danger-muted: rgba(209, 59, 69, 0.1);
  --info: #2a7ed4;
  --info-muted: rgba(42, 126, 212, 0.1);

  --scrollbar-thumb: rgba(0, 0, 0, 0.18);
  --scrollbar-track: transparent;
  --shadow-window: 0 12px 40px rgba(0, 0, 0, 0.12);
  --shadow-pop: 0 8px 24px rgba(0, 0, 0, 0.1);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-fast: 0ms;
    --motion-normal: 0ms;
  }
}
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body,
#root {
  margin: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: var(--bg-app);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: transparent;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

button:focus-visible,
textarea:focus-visible,
input:focus-visible {
  outline: 2px solid var(--border-focus);
  outline-offset: 1px;
}

.app-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--bg-app);
  border-radius: var(--radius-window);
  overflow: hidden;
}

/* Drag strip under traffic lights */
.titlebar-drag {
  height: 12px;
  min-height: 12px;
  flex-shrink: 0;
  background: transparent;
}

.workbench {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ===== Left sidebar (reference) ===== */
.sidebar {
  width: 248px;
  min-width: 220px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  padding: var(--space-3) var(--space-2) var(--space-2);
  gap: 2px;
}

.brand {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 4px var(--space-2) var(--space-3);
  color: var(--text-primary);
  font-weight: 600;
  font-size: var(--text-sm);
}

.brand__logo {
  width: 22px;
  height: 22px;
  border-radius: var(--radius-full);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}

.nav-new {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin: 0 var(--space-1) var(--space-2);
  padding: 8px 10px;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-size: var(--text-sm);
}

.nav-new:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: calc(100% - 8px);
  margin: 1px 4px;
  padding: 8px 10px;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-size: var(--text-sm);
  text-align: left;
}

.nav-item:hover:not(:disabled) {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.nav-item--active {
  background: rgba(230, 184, 77, 0.14);
  color: var(--warning);
  font-weight: 500;
}

[data-theme="light"] .nav-item--active {
  background: var(--warning-muted);
  color: var(--warning);
}

.nav-item--soon {
  opacity: 0.55;
}

.nav-item__icon {
  width: 16px;
  text-align: center;
  opacity: 0.85;
  font-size: 13px;
}

.nav-item__badge {
  margin-left: auto;
  font-size: 10px;
  color: var(--text-tertiary);
}

.sidebar__label {
  margin: var(--space-3) var(--space-3) var(--space-1);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-tertiary);
}

.recents {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 0 4px;
}

.recent-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  padding: 8px 10px;
  border-radius: var(--radius-md);
  text-align: left;
  color: var(--text-secondary);
}

.recent-item:hover {
  background: var(--bg-hover);
}

.recent-item--active {
  background: var(--bg-active);
  color: var(--text-primary);
}

.recent-item__title {
  font-size: var(--text-sm);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.recent-item__meta {
  font-size: 11px;
  color: var(--text-tertiary);
}

.sidebar__footer {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2);
  border-top: 1px solid var(--border-subtle);
  margin-top: var(--space-2);
}

.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-full);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--text-secondary);
}

.user-meta {
  min-width: 0;
  flex: 1;
}

.user-meta__name {
  font-size: var(--text-sm);
  color: var(--text-primary);
}

.user-meta__hint {
  font-size: 11px;
  color: var(--text-tertiary);
}

/* ===== Main ===== */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-main);
}

.main__top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: var(--space-4) var(--space-5) var(--space-2);
  gap: var(--space-3);
}

.main__title {
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

.main__sub {
  font-size: var(--text-xs);
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  margin-top: 4px;
}

.main__top-actions {
  display: flex;
  gap: var(--space-2);
  align-items: center;
}

.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: var(--space-2) var(--space-5) var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.fold {
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: transparent;
  overflow: hidden;
}

.fold__summary {
  list-style: none;
  cursor: pointer;
  padding: 8px 12px;
  font-size: var(--text-sm);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.fold__summary::-webkit-details-marker {
  display: none;
}

.fold__body {
  padding: 0 12px 12px;
  font-size: var(--text-sm);
  color: var(--text-secondary);
  white-space: pre-wrap;
  font-family: var(--font-mono);
  max-height: 220px;
  overflow: auto;
}

.message {
  max-width: 760px;
}

.message__role {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 4px;
}

.message__body {
  white-space: pre-wrap;
  word-break: break-word;
  font-size: var(--text-md);
  line-height: 1.55;
}

.message--user .message__body {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
}

.message--assistant .message__body--streaming::after {
  content: "▍";
  color: var(--accent);
  animation: blink 1s step-end infinite;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}

.working {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-tertiary);
  font-size: var(--text-sm);
  padding: 4px 0;
}

.working__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1.5px solid var(--text-tertiary);
  border-top-color: transparent;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* Plan card (reference) */
.plan-card {
  max-width: 720px;
  margin: var(--space-3) auto;
  width: 100%;
  background: var(--bg-elevated);
  border: 1px solid rgba(230, 184, 77, 0.35);
  border-radius: 14px;
  padding: var(--space-4) var(--space-5);
  box-shadow: var(--shadow-pop);
}

.plan-card__badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--warning);
  margin-bottom: var(--space-2);
}

.plan-card__title {
  font-size: 18px;
  font-weight: 600;
  margin: 0 0 var(--space-3);
  color: var(--text-primary);
}

.plan-card__h {
  font-size: 13px;
  font-weight: 600;
  margin: 0 0 6px;
  color: var(--text-primary);
}

.plan-card__body {
  font-size: var(--text-sm);
  color: var(--text-secondary);
  line-height: 1.55;
  margin-bottom: var(--space-4);
}

.plan-card__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

/* Permission bar */
.perm-bar {
  margin: 0 var(--space-5) var(--space-2);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  background: var(--warning-muted);
  border: 1px solid var(--warning);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.perm-bar__title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-primary);
}

.perm-bar__preview {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
  max-height: 6.5em;
  overflow: auto;
  white-space: pre-wrap;
}

.perm-bar__actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

/* Error banner */
.error-banner {
  margin: 0 var(--space-5) var(--space-2);
  padding: var(--space-3);
  border-radius: var(--radius-md);
  background: var(--danger-muted);
  border: 1px solid var(--danger);
  font-size: var(--text-sm);
}

.error-banner__code {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--danger);
  margin-bottom: 4px;
}

/* Composer */
.composer-wrap {
  padding: var(--space-3) var(--space-5) var(--space-4);
}

.composer {
  border: 1px solid var(--border-subtle);
  background: var(--bg-elevated);
  border-radius: 16px;
  padding: 10px 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.composer__input {
  width: 100%;
  min-height: 44px;
  max-height: 160px;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text-primary);
  font-size: var(--text-md);
  line-height: 1.45;
}

.composer__input::placeholder {
  color: var(--text-tertiary);
}

.composer__row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 26px;
  padding: 0 8px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid transparent;
  font-size: 12px;
  color: var(--text-secondary);
}

.chip:hover:not(:disabled) {
  background: var(--bg-hover);
  border-color: var(--border-subtle);
}

.chip--ask {
  color: var(--text-secondary);
}

.composer__spacer {
  flex: 1;
}

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  background: var(--bg-hover);
}

.icon-btn:hover:not(:disabled) {
  color: var(--text-primary);
}

.icon-btn--primary {
  background: var(--text-secondary);
  color: var(--bg-app);
}

.icon-btn--danger {
  background: var(--danger-muted);
  color: var(--danger);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 12px;
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  font-weight: 500;
}

.btn--primary {
  background: var(--accent);
  color: var(--accent-fg, #fff);
  border-color: transparent;
}

.btn--primary:hover:not(:disabled) {
  background: var(--accent-hover, var(--accent));
  filter: none;
}

.btn--ghost {
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}

.btn--ghost:hover:not(:disabled) {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.btn--danger {
  background: var(--danger-muted);
  color: var(--danger);
}

/* Modals / overlays */
.overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 24px;
}

.modal {
  width: min(520px, 100%);
  max-height: 90vh;
  overflow: auto;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-pop);
  padding: var(--space-5);
}

.modal h2 {
  margin: 0 0 var(--space-3);
  font-size: 18px;
}

.modal p {
  color: var(--text-secondary);
  font-size: var(--text-sm);
}

.entry-grid {
  display: grid;
  gap: 10px;
  margin: var(--space-4) 0;
}

.entry-card {
  text-align: left;
  padding: 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-main);
}

.entry-card:hover {
  border-color: var(--border-strong);
  background: var(--bg-hover);
}

.entry-card__t {
  font-weight: 600;
  margin-bottom: 4px;
}

.entry-card__d {
  font-size: 12px;
  color: var(--text-secondary);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}

.field label {
  font-size: 12px;
  color: var(--text-secondary);
}

.field input,
.field select,
.field textarea {
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 8px 10px;
  color: var(--text-primary);
}

.setup-bar {
  margin: 0 var(--space-5);
  padding: 8px 12px;
  border-radius: var(--radius-md);
  background: var(--info-muted);
  border: 1px solid var(--border-subtle);
  font-size: 12px;
  color: var(--text-secondary);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}

.setup-bar strong {
  color: var(--text-primary);
  font-weight: 500;
}

.empty-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text-secondary);
  padding: 48px;
  text-align: center;
}

.empty-center h3 {
  margin: 0;
  color: var(--text-primary);
  font-weight: 500;
}

/* Aside */
.aside {
  width: 280px;
  border-left: 1px solid var(--border-subtle);
  background: var(--bg-aside);
  transition: width 160ms ease, opacity 160ms ease;
  overflow: hidden;
}

.aside--collapsed {
  width: 0;
  border: none;
  opacity: 0;
}

.aside__inner {
  width: 280px;
  padding: 16px;
  font-size: 13px;
  color: var(--text-secondary);
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}

</style></head><body style="height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-app)">
